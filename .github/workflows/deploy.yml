name: Deploy game to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::814808959987:role/nj-2048-github-actions-deploy
          aws-region: ap-south-1

      - name: Sync game to prod bucket
        run: aws s3 sync . s3://nj-2048-game-prod --delete --exclude ".git/*" --exclude ".github/*"
